name: Check Agent Skill Contracts
description: Enforce deterministic repository-owned behavioral contracts for SKILL.md files.
author: agent-skill-contracts contributors

inputs:
  path:
    description: Contract file or directory to scan.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install agent-skill-contracts
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Check contracts
      shell: bash
      run: skill-contract check "${{ inputs.path }}" --format github

branding:
  icon: shield
  color: blue
